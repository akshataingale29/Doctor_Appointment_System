<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MedEase Admin{% endblock %}</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Base CSS -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }
        
        a {
            text-decoration: none;
            color: inherit;
        }
        
        /* Admin Dashboard Wrapper */
        .admin-dashboard-wrapper {
            display: flex;
            min-height: 100vh;
        }
        
        /* Sidebar Styles */
        .admin-sidebar {
            width: 280px;
            background: linear-gradient(180deg, #10847e 0%, #064e4a 100%);
            color: white;
            transition: all 0.3s ease;
            z-index: 100;
        }
        
        .admin-profile {
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .admin-avatar {
            width: 80px;
            height: 80px;
            background-color: #fff;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .admin-avatar i {
            font-size: 40px;
            color: #10847e;
        }
        
        .admin-profile h3 {
            margin: 0 0 5px;
            font-size: 18px;
            font-weight: 600;
        }
        
        .admin-profile p {
            font-size: 14px;
            opacity: 0.8;
            margin: 0;
        }
        
        .admin-nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .admin-nav li {
            margin: 5px 0;
            transition: all 0.3s ease;
        }
        
        .admin-nav li a {
            display: flex;
            align-items: center;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            transition: all 0.3s ease;
            font-size: 15px;
        }
        
        .admin-nav li a i {
            margin-right: 10px;
            font-size: 18px;
            min-width: 25px;
        }
        
        .admin-nav li:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .admin-nav li.active {
            background-color: rgba(255, 255, 255, 0.2);
            border-left: 4px solid #fff;
        }
        
        /* Content Styles */
        .admin-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e3e6f0;
        }
        
        .admin-header h1 {
            font-size: 24px;
            color: #333;
            display: flex;
            align-items: center;
        }
        
        .admin-header h1 i {
            margin-right: 10px;
            color: #10847e;
        }
        
        .admin-header-right {
            display: flex;
            align-items: center;
        }
        
        /* Add Button */
        .add-btn {
            background-color: #10847e;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            transition: background-color 0.3s;
            border: none;
            cursor: pointer;
        }
        
        .add-btn i {
            margin-right: 8px;
        }
        
        .add-btn:hover {
            background-color: #064e4a;
        }
        
        /* Messages */
        .messages {
            margin-bottom: 25px;
        }
        
        .message {
            position: relative;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-size: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            0% {
                transform: translateY(-20px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .message.error {
            background-color: #fff2f0;
            color: #cb2431;
            border-left: 4px solid #cb2431;
        }
        
        .message.success {
            background-color: #f0fff4;
            color: #22863a;
            border-left: 4px solid #22863a;
        }
        
        .close-message {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.3s;
            color: inherit;
        }
        
        .close-message:hover {
            opacity: 1;
        }
        
        /* Footer */
        .admin-footer {
            margin-top: auto;
            padding: 15px 20px;
            border-top: 1px solid #eee;
            font-size: 13px;
            color: #666;
            text-align: center;
        }
        
        /* Mobile Toggle */
        .mobile-toggle {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background-color: #10847e;
            color: white;
            border-radius: 50%;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            cursor: pointer;
        }
        
        /* Responsive Styles */
        @media (max-width: 992px) {
            .admin-sidebar {
                position: fixed;
                left: -280px;
                height: 100vh;
                transition: left 0.3s ease;
            }
            
            .admin-sidebar.active {
                left: 0;
            }
            
            .mobile-toggle {
                display: flex;
            }
            
            .overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.5);
                z-index: 99;
            }
            
            .overlay.active {
                display: block;
            }
        }
        
        @media (max-width: 768px) {
            .admin-content {
                padding: 15px;
            }
            
            .admin-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
    
    {% block styles %}{% endblock %}
</head>
<body>
    <div id="overlay" class="overlay"></div>
    
    <div id="mobile-toggle" class="mobile-toggle">
        <i class="fas fa-bars"></i>
    </div>
    
    {% block admin_content %}{% endblock %}
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Mobile sidebar toggle
            const mobileToggle = document.getElementById('mobile-toggle');
            const sidebar = document.querySelector('.admin-sidebar');
            const overlay = document.getElementById('overlay');
            
            if (mobileToggle) {
                mobileToggle.addEventListener('click', function() {
                    sidebar.classList.toggle('active');
                    overlay.classList.toggle('active');
                    
                    if (sidebar.classList.contains('active')) {
                        this.innerHTML = '<i class="fas fa-times"></i>';
                    } else {
                        this.innerHTML = '<i class="fas fa-bars"></i>';
                    }
                });
            }
            
            if (overlay) {
                overlay.addEventListener('click', function() {
                    sidebar.classList.remove('active');
                    overlay.classList.remove('active');
                    mobileToggle.innerHTML = '<i class="fas fa-bars"></i>';
                });
            }
            
            // Close message buttons
            const closeButtons = document.querySelectorAll('.close-message');
            closeButtons.forEach(button => {
                button.addEventListener('click', function() {
                    this.parentElement.style.display = 'none';
                });
            });
        });
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
